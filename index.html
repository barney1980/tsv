function userDbKey(userId){return USER_DB_PREFIX+String(userId||"");}
function clearLocalDatabaseState(){
 localStorage.removeItem(KEY);
 localStorage.removeItem(DB_ID_KEY);
 db={players:[],trainings:[],observations:[],assessments:{},exercises:[],planning:{seasons:[],blocks:[],cycles:[],seasonPlans:[]},settings:{clubName:"TSV Nettelkamp",logo:"",coachName:"",coachBirthDate:"",themeColor:"#176b45",appearance:"light",trainingTopics:[],topicBlocks:[],seasons:["2026/27"]},teams:[],activeTeamId:""};
}
function activateUserLocalDatabase(userId){
 currentAuthUserId=userId||"";
 allowLegacyMigration=false;
 const userKey=userDbKey(currentAuthUserId);
 let raw=localStorage.getItem(userKey);
 // IMPORTANT: Never use the generic legacy/local database as a fallback for a
 // different authenticated user. That would leak User 1's browser cache into
 // User 2's session. The legacy database may only be claimed once, by the
 // first authenticated user who has no user-specific database yet.
 if(!raw){
   const legacyOwner=localStorage.getItem(LEGACY_OWNER_KEY);
   const legacy=localStorage.getItem(KEY);
   if(!legacyOwner && legacy){
     raw=legacy;
     localStorage.setItem(userKey,raw);
     localStorage.setItem(LEGACY_OWNER_KEY,currentAuthUserId);
     allowLegacyMigration=true;
   }
 }
 if(raw){try{db=JSON.parse(raw);}catch(e){raw=null;}}
 if(!raw) clearLocalDatabaseState();
 // Re-run the lightweight defaults/migrations that normally run at startup.
 if(!db.teams||!Array.isArray(db.teams))db.teams=[];
 db.teams.forEach(t=>{if(!t.season)t.season="2026/27"});
 if(!db.activeTeamId&&db.teams[0])db.activeTeamId=db.teams[0].id;
 if(!Array.isArray(db.players))db.players=[];
 if(!Array.isArray(db.trainings))db.trainings=[];
 if(!Array.isArray(db.observations))db.observations=[];
 if(!db.assessments||typeof db.assessments!=="object")db.assessments={};
 if(!Array.isArray(db.exercises))db.exercises=[];
 if(!db.planning||typeof db.planning!=="object")db.planning={seasons:[],blocks:[],cycles:[]};
 if(!Array.isArray(db.planning.seasons))db.planning.seasons=[];
 if(!Array.isArray(db.planning.blocks))db.planning.blocks=[];
 if(!Array.isArray(db.planning.cycles))db.planning.cycles=[];
 if(!db.settings||typeof db.settings!=="object")db.settings={};
 if(!Array.isArray(db.settings.trainingTopics))db.settings.trainingTopics=[];
 if(!Array.isArray(db.settings.topicBlocks))db.settings.topicBlocks=[];
 if(!Array.isArray(db.settings.seasons))db.settings.seasons=[];
 if(!db.settings.clubName)db.settings.clubName="TSV Nettelkamp";
 if(!db.settings.themeColor||!/^#[0-9a-fA-F]{6}$/.test(db.settings.themeColor))db.settings.themeColor="#176b45";
 if(db.settings.appearance!=="dark"&&db.settings.appearance!=="light")db.settings.appearance="light";
 db.players.forEach(p=>{if(!p.teamId&&db.teams[0])p.teamId=db.teams[0].id;if(!p.gender)p.gender="männlich"});
 db.trainings.forEach(t=>{if(!t.teamId&&db.teams[0])t.teamId=db.teams[0].id;if(!Array.isArray(t.exercises))t.exercises=[]});
 if(!db.meta||typeof db.meta!=="object")db.meta={};
 if(!db.meta.databaseId)db.meta.databaseId=crypto.randomUUID();
 db.meta.appVersion=APP_VERSION;
 localStorage.setItem(DB_ID_KEY,db.meta.databaseId);
 localStorage.setItem(userKey,JSON.stringify(db));
 applyThemeColor(db.settings.themeColor); applyThemeMode(db.settings.appearance); updateTeamHeader();
}
function persistUserLocalDatabase(){
 if(!currentAuthUserId)return;
 localStorage.setItem(userDbKey(currentAuthUserId),JSON.stringify(db));
 localStorage.setItem(DB_ID_KEY,db.meta?.databaseId||"");
}
function save(){
 if(!db.meta||typeof db.meta!=="object")db.meta={};
 if(!db.meta.databaseId)db.meta.databaseId=crypto.randomUUID();
 db.meta.databaseVersion=DB_FORMAT_VERSION;
 db.meta.appVersion=APP_VERSION;
 db.meta.updatedAt=new Date().toISOString();
 localStorage.setItem(DB_ID_KEY,db.meta.databaseId);
 localStorage.setItem(KEY,JSON.stringify(db));
 persistUserLocalDatabase();
 hasUnsavedChanges=false;
 updateSaveState(true);
 scheduleCloudSync();
}

function deleteTeam(id){
 if(db.teams.length<=1)return alert("Mindestens ein Team muss bestehen bleiben.");

 if(!confirm(`Team "${t.name}" · Saison ${t.season||"–"} und alle darin gespeicherten Daten löschen?`))return;
 let playerIds=db.players.filter(p=>p.teamId===id).map(p=>p.id);
 let trainingIds=db.trainings.filter(x=>x.teamId===id).map(t=>t.id);
 db.players=db.players.filter(p=>p.teamId!==id);
 db.trainings=db.trainings.filter(x=>x.teamId!==id);
 db.observations=db.observations.filter(x=>x.teamId!==id);
 db.trainingAttendance=(db.trainingAttendance||[]).filter(a=>!trainingIds.includes(a.trainingId)&&!playerIds.includes(a.playerId));
 db.trainingExercises=(db.trainingExercises||[]).filter(x=>!trainingIds.includes(x.trainingId));
 playerIds.forEach(pid=>delete db.assessments[pid]);
 db.teams=db.teams.filter(x=>x.id!==id);if(db.activeTeamId===id)db.activeTeamId=db.teams[0].id;save();showSuccessToast("Mannschaft wurde erfolgreich gelöscht.");updateTeamHeader();manageTeams();
}

function formatDateDE(value){
 let m=String(value||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
 return m?`${m[3]}.${m[2]}.${m[1]}`:(value||"–");
}
function pastTeamTrainings(){
 const today=new Date().toISOString().slice(0,10);
 return teamTrainings().filter(t=>t.date&&t.date<today);
}
function pastTeamTrainingsForPlayer(p){

}
function attendanceStatsForPlayers(players,trainings){
 let possible=0,present=0;
 trainings.forEach(t=>players.forEach(p=>{
   if(p.entryDate&&t.date&&t.date<p.entryDate)return;
   possible++;
   if((t.present||[]).includes(p.id))present++;
 }));
 return {possible,present,pct:possible?Math.round(present/possible*100):null};
}
function topicGroups(){

 teamTrainings().forEach(tr=>{let topic=(tr.topic||"").trim();if(!topic)return;let key=topic.toLocaleLowerCase("de-DE");if(!groups[key])groups[key]={label:topic,ids:[]};groups[key].ids.push(tr.id);});
 return Object.values(groups).sort((a,b)=>a.label.localeCompare(b.label,"de-DE"));
}

let playerSort={key:"name",dir:"asc"};
let playerFilters={name:"",gender:"",birth:"",attendance:""};
function playerStats(p){
 let eligibleTrainings=pastTeamTrainingsForPlayer(p);
 let total=eligibleTrainings.length;
 let present=eligibleTrainings.filter(t=>(t.present||[]).includes(p.id)).length;
 let pct=total?Math.round(present/total*100):0;
 return {total,present,pct};
}
function sortPlayers(list){
 return [...list].sort((a,b)=>{
   let av,bv;
   if(playerSort.key==="attendance"){
     av=playerStats(a).pct; bv=playerStats(b).pct;
     if(av!==bv) return playerSort.dir==="asc"?av-bv:bv-av;
     av=a.name||""; bv=b.name||"";
   }else if(playerSort.key==="birth"){
     av=Number(derivedBirthYear(a))||0; bv=Number(derivedBirthYear(b))||0;
     if(av!==bv) return playerSort.dir==="asc"?av-bv:bv-av;
     av=a.name||""; bv=b.name||"";
   }else if(playerSort.key==="gender"){
     av=(a.gender||"").toLocaleLowerCase("de-DE");
     bv=(b.gender||"").toLocaleLowerCase("de-DE");
     if(av!==bv) return playerSort.dir==="asc"?av.localeCompare(bv,"de-DE"):bv.localeCompare(av,"de-DE");
     av=a.name||""; bv=b.name||"";
   }else{
     av=(a.name||"").toLocaleLowerCase("de-DE");
     bv=(b.name||"").toLocaleLowerCase("de-DE");
   }
   return playerSort.dir==="asc"?av.localeCompare(bv,"de-DE"):bv.localeCompare(av,"de-DE");
 });
}
function filteredPlayers(){
 return teamPlayers().filter(p=>{
   if(playerFilters.name && !(p.name||"").toLocaleLowerCase("de-DE").includes(playerFilters.name.toLocaleLowerCase("de-DE"))) return false;
   if(playerFilters.gender && (p.gender||"")!==playerFilters.gender) return false;
   if(playerFilters.birth && String(derivedBirthYear(p))!==String(playerFilters.birth)) return false;
   if(playerFilters.attendance){let pct=playerStats(p).pct;if(playerFilters.attendance==="high"&&pct<=67)return false;if(playerFilters.attendance==="mid"&&(pct<35||pct>67))return false;if(playerFilters.attendance==="low"&&pct>=35)return false;} 
   return true;
 });
}

async function deletePlayer(id){

      let r=await supabaseClient.from("training_attendance").delete().eq("player_id",id);

      r=await supabaseClient.from("player_observations").delete().eq("player_id",id);
      if(r.error)throw r.error;
      r=await supabaseClient.from("player_assessments").delete().eq("player_id",id);
      if(r.error)throw r.error;
      r=await supabaseClient.from("players").delete().eq("id",id);

let periodAvg=period=>{let vals=[];teamPlayers().forEach(p=>{let a=db.assessments[p.id]||{};let v=Object.values(a[period]||{}).map(Number).filter(Number.isFinite);if(v.length)vals.push(v.reduce((x,y)=>x+y,0)/v.length)});return vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null};

let rows=list.map(p=>{let a=db.assessments[p.id]||{start:{},mid:{},end:{}};a.start=a.start||{};a.mid=a.mid||{};a.end=a.end||{};let avg=period=>{let vals=Object.values(a[period]).map(Number).filter(Number.isFinite);return vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null};let s=avg("start"),m=avg("mid"),e=avg("end"),latest=e!==null?e:(m!==null?m:s),delta=(s!==null&&latest!==null)?latest-s:null;let deltaText=delta===null?"–":(delta>0?"+":"")+delta.toFixed(1).replace(".",",");let deltaClass=delta===null?"muted":delta>0?"positive":delta<0?"negative":"neutral";let genderClass=p.gender==="weiblich"?"female":"male";return `<tr><td><b class="player-name ${genderClass}">${esc(p.name)}</b></td><td>${fmt(s)}</td><td>${fmt(m)}</td><td>${fmt(e)}</td><td><span class="dev-delta ${deltaClass}">${deltaText}</span></td><td><button class="primary" onclick="assess('${p.id}')">Bewerten</button></td></tr>`}).join("");

  }).join("");

    <div class="mini-kpi-grid training-kpis">
      <div class="mini-kpi"><div class="mini-kpi-label">Trainingseinheiten</div><div class="mini-kpi-value">${allTrainings.length}</div><div class="mini-kpi-sub">für ${esc(activeTeam().name)}</div></div>
      <div class="mini-kpi"><div class="mini-kpi-label">Trainingsbeteiligung</div><div class="mini-kpi-value">${overallAttendance!==null?overallAttendance+" %":"–"}</div><div class="mini-kpi-sub">über alle dokumentierten Trainings</div></div>

    <div class="training-sortbar"><div><span class="sort-label">Sortierung</span><select onchange="setTrainingSort(this.value)"><option value="desc" ${trainingSort==="desc"?"selected":""}>Neueste zuerst</option><option value="asc" ${trainingSort==="asc"?"selected":""}>Älteste zuerst</option></select></div><span class="muted">${source.length} Training${source.length===1?"":"seinheiten"} · ${sortLabel}</span></div>

  </div>`;
}

function newTraining(){trainingForm(null)}
function editTraining(id){trainingForm(db.trainings.find(t=>t.id===id))}
function dateCodeForTraining(value){
  const m=String(value||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m){const d=new Date();return `T${String(d.getDate()).padStart(2,"0")}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getFullYear()).slice(-2)}`;}
  return `T${m[3]}${m[2]}${m[1].slice(-2)}`;
}
function nextTrainingExerciseCode(dateValue, draft=[]){
  const prefix=dateCodeForTraining(dateValue);
  let max=0;
  db.trainings.forEach(tr=>(tr.exercises||[]).forEach(ex=>{
    const m=String(ex.code||"").match(new RegExp("^"+prefix+"_Ü-(\\d+)$"));
    if(m)max=Math.max(max,Number(m[1])||0);
  }));
  draft.forEach(ex=>{
    const m=String(ex.code||"").match(new RegExp("^"+prefix+"_Ü-(\\d+)$"));
    if(m)max=Math.max(max,Number(m[1])||0);
  });
  return `${prefix}_Ü-${max+1}`;
}
function syncTrainingExercisesDraft(){
  if(!Array.isArray(window.trainingExercisesDraft))window.trainingExercisesDraft=[];
}
function renumberTrainingExercises(dateValue){
  syncTrainingExercisesDraft();
  const prefix=dateCodeForTraining(dateValue);
  window.trainingExercisesDraft.forEach((ex,i)=>{ex.code=`${prefix}_Ü-${i+1}`});
}
function renderTrainingExercises(){

  wrap.innerHTML=list.map((ex,i)=>`<div class="training-exercise-card" draggable="true" data-ex-id="${ex.id}" ondragstart="trainingExerciseDragStart(event,'${ex.id}')" ondragover="trainingExerciseDragOver(event)" ondrop="trainingExerciseDrop(event,'${ex.id}')" ondragend="trainingExerciseDragEnd(event)"><div class="training-exercise-head"><div class="training-exercise-main"><span class="training-exercise-drag" title="Per Drag & Drop verschieben">☷</span><div class="training-exercise-code">${esc(ex.code)}</div><div class="training-exercise-title">${esc(ex.name||"Ohne Bezeichnung")}</div><div class="training-exercise-duration">${esc(ex.duration||"–")} Min.</div></div><div class="training-exercise-actions"><button type="button" onclick="viewTrainingExercise('${ex.id}')">Ansehen</button><button type="button" onclick="editTrainingExercise('${ex.id}')">Bearbeiten</button><button type="button" onclick="removeTrainingExercise('${ex.id}')">Entfernen</button></div></div></div>`).join("") || `<div class="empty">Noch keine Übungen für diese Trainingseinheit angelegt.</div>`;
}
function trainingExerciseDragStart(event,id){window.trainingExerciseDragId=id;event.currentTarget.classList.add("dragging");event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",id)}
function trainingExerciseDragOver(event){event.preventDefault();event.dataTransfer.dropEffect="move"}
function trainingExerciseDrop(event,targetId){
  event.preventDefault();
  const sourceId=window.trainingExerciseDragId||event.dataTransfer.getData("text/plain");
  if(!sourceId||sourceId===targetId)return;
  const list=window.trainingExercisesDraft||[];
  const from=list.findIndex(x=>x.id===sourceId),to=list.findIndex(x=>x.id===targetId);
  if(from<0||to<0)return;
  const [moved]=list.splice(from,1);list.splice(to,0,moved);
  renumberTrainingExercises(document.getElementById("td")?.value||new Date().toISOString().slice(0,10));
  renderTrainingExercises();
}
function trainingExerciseDragEnd(event){event.currentTarget.classList.remove("dragging");window.trainingExerciseDragId=null}
function openTrainingExerciseEditor(id){

  wrap.innerHTML=`<div class="training-exercise-editor"><div class="muted" style="margin-bottom:6px">${ex._new?"Neue Übung":"Übung bearbeiten"} · <b>${esc(ex.code)}</b></div><div class="library-picker"><div style="flex:1;min-width:280px"><label>Aus Übungssammlung</label><select id="trainingExLibrary"><option value="">— Übung auswählen —</option>${options}</select></div><button type="button" onclick="applyTrainingLibraryExercise('${ex.id}')">Auswahl übernehmen</button></div>${linked?`<div class="training-exercise-library-meta">Vorlage: <b>${esc(linked.code||"")}</b> · ${esc(linked.name||"")} · <span>Für dieses Training als eigene Kopie angepasst</span></div>`:`<div class="training-exercise-library-meta">Bitte eine Übung aus der zentralen Sammlung auswählen. Beim Übernehmen wird daraus eine <b>eigene Trainingskopie</b>.</div>`}<div class="training-exercise-meta" style="margin-top:10px"><div><label>Bezeichnung / Überschrift</label><input id="trainingExName" value="${esc(ex.name||"")}" placeholder="z. B. 2 gegen 1 – selber gehen oder passen"></div><div><label>Zeitansatz</label><div class="duration-input"><input id="trainingExDuration" type="number" min="1" step="1" value="${esc(ex.duration||"")}" placeholder="15"><span class="duration-suffix">Min.</span></div></div></div><div style="margin-top:10px"><label>Ablauf / Beschreibung</label><textarea id="trainingExNotes" placeholder="Organisation, Ablauf, Coachingpunkte ...">${esc(ex.notes||"")}</textarea></div><div class="actions"><button type="button" class="primary" onclick="saveTrainingExerciseDraft('${ex.id}')">Übung speichern</button><button type="button" onclick="cancelTrainingExerciseEditor()">Abbrechen</button></div></div>`;
  document.getElementById("trainingExName")?.focus();

function applyTrainingLibraryExercise(id){
  const ex=window.trainingExercisesDraft?.find(x=>x.id===id);if(!ex)return;
  const sourceId=document.getElementById("trainingExLibrary")?.value||"";
  if(!sourceId){ex.exerciseId="";document.getElementById("trainingExName").value=ex.name||"";document.getElementById("trainingExNotes").value=ex.notes||"";return;}
  const source=db.exercises.find(e=>e.id===sourceId);if(!source)return;
  // Die zentrale Übung dient nur als Vorlage. Für dieses Training werden
  // die bearbeitbaren Felder als eigene Instanz übernommen; Änderungen hier
  // verändern niemals den Datensatz in db.exercises.
  ex.exerciseId=source.id;
  ex.name=source.name||"";
  ex.notes=source.notes||"";
  ex.duration=source.duration||"";
  document.getElementById("trainingExName").value=ex.name;
  document.getElementById("trainingExNotes").value=ex.notes;
  document.getElementById("trainingExDuration").value=ex.duration;
  showSuccessToast("Übung als eigene Trainingskopie übernommen.");
}
function addTrainingExercise(){
  if(document.getElementById("trainingExerciseEditor")?.innerHTML.trim()){alert("Bitte die geöffnete Übung zuerst speichern oder abbrechen.");return}
  const ex={id:crypto.randomUUID(),exerciseId:"",code:"",name:"",notes:"",duration:"",_new:true};
  window.trainingExercisesDraft.push(ex);
  renumberTrainingExercises(document.getElementById("td")?.value||new Date().toISOString().slice(0,10));
  openTrainingExerciseEditor(ex.id);
}
function saveTrainingExerciseDraft(id){
  const ex=window.trainingExercisesDraft?.find(x=>x.id===id);if(!ex)return;
  const name=document.getElementById("trainingExName")?.value.trim()||"";
  const duration=document.getElementById("trainingExDuration")?.value.trim().replace(/\s*Min\.?$/i,"")||"";
  const notes=document.getElementById("trainingExNotes")?.value.trim()||"";
  if(!ex.exerciseId)return alert("Bitte zuerst eine Übung aus der Übungssammlung auswählen.");
  if(!name)return alert("Bitte eine Bezeichnung für die Übung eingeben.");
  if(!duration)return alert("Bitte einen Zeitansatz in Minuten eingeben.");
  ex.name=name;ex.duration=duration;ex.notes=notes;ex._new=false;ex.instanceId=ex.instanceId||ex.id;
  // Nur die Trainingsinstanz wird geändert. Die zentrale Übungssammlung bleibt unverändert.
  window.trainingExerciseEditorId=null;document.getElementById("trainingExerciseEditor").innerHTML="";
  renumberTrainingExercises(document.getElementById("td")?.value||new Date().toISOString().slice(0,10));renderTrainingExercises();
  showSuccessToast("Übung wurde erfolgreich gespeichert.");
}
function editTrainingExercise(id){
  if(document.getElementById("trainingExerciseEditor")?.innerHTML.trim()){alert("Bitte die geöffnete Übung zuerst speichern oder abbrechen.");return}
  openTrainingExerciseEditor(id);
}
function cancelTrainingExerciseEditor(){
  const id=window.trainingExerciseEditorId;
  if(id){const ex=window.trainingExercisesDraft?.find(x=>x.id===id);if(ex?._new){window.trainingExercisesDraft=window.trainingExercisesDraft.filter(x=>x.id!==id)}}
  window.trainingExerciseEditorId=null;const wrap=document.getElementById("trainingExerciseEditor");if(wrap)wrap.innerHTML="";renumberTrainingExercises(document.getElementById("td")?.value||new Date().toISOString().slice(0,10));renderTrainingExercises();
}
function removeTrainingExercise(id){
  if(!confirm("Diese Übung wirklich entfernen?"))return;
  window.trainingExercisesDraft=(window.trainingExercisesDraft||[]).filter(x=>x.id!==id);
  if(window.trainingExerciseEditorId===id){window.trainingExerciseEditorId=null;document.getElementById("trainingExerciseEditor").innerHTML=""}
  renumberTrainingExercises(document.getElementById("td")?.value||new Date().toISOString().slice(0,10));renderTrainingExercises();
  showSuccessToast("Übung wurde erfolgreich entfernt.");

function printTrainingPlanPDF(id){

  let id,updatedAt;
  if(q.data){
    const r=await supabaseClient.from("season_plans").update(base).eq("id",q.data.id).select("id,updated_at").single();
    if(r.error)throw new Error("Saisonplan aktualisieren: "+r.error.message);
    id=r.data.id;updatedAt=r.data.updated_at;
  }else{
    const r=await supabaseClient.from("season_plans").insert(base).select("id,updated_at").single();
    if(r.error)throw new Error("Saisonplan anlegen: "+r.error.message);
    id=r.data.id;updatedAt=r.data.updated_at;
  }
  for(const table of ["season_plan_sessions","season_plan_topics","season_plan_goals"]){
    const d=await supabaseClient.from(table).delete().eq("season_plan_id",id);
    if(d.error)throw new Error(table+" löschen: "+d.error.message);
  }
  const goals=(p.goals||[]).map((x,i)=>({user_id:currentAuthUserId,season_plan_id:id,title:String(x||"").trim(),description:null,sort_order:i})).filter(x=>x.title);
  if(goals.length){const r=await supabaseClient.from("season_plan_goals").insert(goals);if(r.error)throw new Error("Saisonziele speichern: "+r.error.message);}
  const topics=(p.blocks||[]).map((b,i)=>({user_id:currentAuthUserId,season_plan_id:id,title:String(b.name||"").trim(),description:b.description||null,goal:b.goal||null,sort_order:i})).filter(x=>x.title||x.description||x.goal);
  if(topics.length){const r=await supabaseClient.from("season_plan_topics").insert(topics);if(r.error)throw new Error("Themen speichern: "+r.error.message);}
  const tr=await supabaseClient.from("season_plan_topics").select("id,sort_order").eq("season_plan_id",id).order("sort_order",{ascending:true});
  if(tr.error)throw new Error("Themen laden: "+tr.error.message);
  const topicIds=new Map((tr.data||[]).map(x=>[Number(x.sort_order),x.id]));
  const sessions=[];let n=0;
  (p.blocks||[]).forEach((b,bi)=>(b.dates||[]).forEach(x=>{const tid=topicIds.get(bi);if(x.date&&tid)sessions.push({user_id:currentAuthUserId,season_plan_id:id,topic_id:tid,training_date:x.date,focus:x.focus||null,sort_order:n++,training_id:x.trainingId||null});}));
  if(sessions.length){const r=await supabaseClient.from("season_plan_sessions").insert(sessions);if(r.error)throw new Error("Termine speichern: "+r.error.message);}
  // Lokalen Saisonplan nach erfolgreichem Cloud-Speichern exakt mit dem gespeicherten Stand synchronisieren.
  // Wichtig: nicht nur nach p.id suchen, da ältere lokale Teststände eine andere ID besitzen können.
  p.id=id;
  p.updatedAt=updatedAt||new Date().toISOString();
  const localPlans=ensureSeasonPlans();
  const localIndex=localPlans.findIndex(x=>x.teamId===p.teamId&&x.season===p.season);
  if(localIndex>=0) localPlans[localIndex]=JSON.parse(JSON.stringify(p));
  else localPlans.push(JSON.parse(JSON.stringify(p)));
  seasonPlanLoadedKey=`${p.teamId}|${p.season}`;
}

function captureSeasonPlanForm(){
 const team=activeTeam();if(!team)return null;
 const season=document.getElementById("seasonPlanSeason")?.value||window.planningForSeason||team.season||db.settings.seasons[0]||"2026/27";
 let p=getSeasonPlan(team.id,season);if(!p)p=createSeasonPlan(team,season);
 p.season=season;
 p.startDate=document.getElementById("seasonPlanStart")?.value||p.startDate;
 p.endDate=document.getElementById("seasonPlanEnd")?.value||p.endDate;
 p.goal=document.getElementById("seasonPlanGoal")?.value||"";
 const goalInputs=[...document.querySelectorAll('input[id^="spgoal_"]')];
 if(goalInputs.length) p.goals=goalInputs.map(el=>el.value);
 const nameInputs=[...document.querySelectorAll('input[id^="spb_name_"]')];
 const descInputs=[...document.querySelectorAll('input[id^="spb_desc_"]')];
 const blockGoalInputs=[...document.querySelectorAll('input[id^="spb_goal_"]')];
 (p.blocks||[]).forEach((b,i)=>{
   if(nameInputs[i]) b.name=String(nameInputs[i].value||"").trim();
   if(descInputs[i]) b.description=String(descInputs[i].value||"");
   if(blockGoalInputs[i]) b.goal=String(blockGoalInputs[i].value||"");
 });
 const available=getAvailablePlanningDates(p.startDate,p.endDate);
 const old={};(p.blocks||[]).forEach((b,i)=>(b.dates||[]).forEach(x=>old[x.date]={blockIndex:i,focus:x.focus||"",status:x.status||"planned"}));
 const byBlock=(p.blocks||[]).map(()=>[]);
 available.forEach(date=>{
   const sel=document.getElementById("spdate_block_"+date);
   const focus=document.getElementById("spdate_focus_"+date);
   const val=sel?.value;
   if(val!==undefined&&val!==""&&p.blocks[Number(val)])byBlock[Number(val)].push({date,focus:focus?.value||"",status:old[date]?.status||"planned"});
   else if(old[date]&&p.blocks[old[date].blockIndex])byBlock[old[date].blockIndex].push(old[date]);
 });
 p.blocks.forEach((b,i)=>b.dates=byBlock[i]);
 return p;
}

async function saveSeasonPlanSessions(){
  const p=captureSeasonPlanForm();if(!p)return;
  try{
    if(!currentAuthUserId||!supabaseClient){upsertSeasonPlan(p);planningSectionSaved("Trainingstermine gespeichert.");return;}
    const q=await ensureCloudSeasonPlanId(p);

    // Punkt 5 darf unabhängig von Punkt 4 gespeichert werden.
    // Deshalb werden die aktuell vorhandenen Themenblöcke hier zuerst
    // sichergestellt und ihre lokalen IDs mit den Datenbank-IDs abgeglichen.
    const topicIds=new Map();
    const existing=await supabaseClient.from("season_plan_topics").select("id,sort_order").eq("season_plan_id",q.id);
    if(existing.error)throw existing.error;
    const existingByOrder=new Map((existing.data||[]).map(x=>[Number(x.sort_order),x.id]));
    for(const [i,b] of (p.blocks||[]).entries()){
      let id=b.id;
      // Eine lokal erzeugte UUID kann direkt verwendet werden. Falls der
      // Themenblock aus einer älteren/geladenen Planung stammt, bleibt seine ID erhalten.
      if(!id)id=existingByOrder.get(i)||crypto.randomUUID();
      b.id=id;
      const row={id,user_id:currentAuthUserId,season_plan_id:q.id,title:String(b.name||"").trim(),description:b.description||null,goal:b.goal||null,sort_order:i};
      const r=await supabaseClient.from("season_plan_topics").upsert(row,{onConflict:"id"});
      if(r.error)throw r.error;
      topicIds.set(i,id);
    }

    const d=await supabaseClient.from("season_plan_sessions").delete().eq("season_plan_id",q.id);
    if(d.error)throw d.error;
    const sessions=[];let n=0;
    for(const [bi,b] of (p.blocks||[]).entries())for(const x of (b.dates||[])){
      const topicId=topicIds.get(bi);
      if(x.date&&topicId)sessions.push({id:x.id||crypto.randomUUID(),user_id:currentAuthUserId,season_plan_id:q.id,topic_id:topicId,training_date:x.date,focus:x.focus||null,sort_order:n++,training_id:x.trainingId||null});
    }
    if(sessions.length){const r=await supabaseClient.from("season_plan_sessions").insert(sessions);if(r.error)throw r.error;}
    p.id=q.id;p.updatedAt=new Date().toISOString();upsertSeasonPlan(p);planningSectionSaved("Trainingstermine in der Datenbank gespeichert.");
  }catch(e){alert("Trainingstermine konnten nicht gespeichert werden.\n\nGrund: "+(e?.message||e));}
}

 const m=db.meta||{};

 if(!id)return;

 a.textContent=m.appVersion||APP_VERSION;
 u.textContent=m.updatedAt?new Date(m.updatedAt).toLocaleString("de-DE"):"–";

function setupLabel(type){return type==='trainingTopics'?'Trainingsschwerpunkt':type==='topicBlocks'?'Themenblock':type==='exerciseCategories'?'Übungskategorie':'Saison'}
function newSetupItem(type){let label=setupLabel(type),v=prompt(`${label} neu anlegen:`);if(v===null)return;v=v.trim();if(!v)return;if(type==='topicBlocks'){if(db.settings.topicBlocks.some(x=>x.name.toLocaleLowerCase('de-DE')===v.toLocaleLowerCase('de-DE')))return alert('Dieser Themenblock ist bereits vorhanden.');db.settings.topicBlocks.push({id:crypto.randomUUID(),name:v})}else{let arr=db.settings[type];if(arr.some(x=>String(x).toLocaleLowerCase('de-DE')===v.toLocaleLowerCase('de-DE')))return alert('Dieser Wert ist bereits vorhanden.');arr.push(v)}save();showSuccessToast(`${label} wurde erfolgreich angelegt.`);setup()}
function editSetupItem(type,index){let arr=db.settings[type],item=arr[index];if(!item)return;let old=type==='topicBlocks'?item.name:item;let label=setupLabel(type),v=prompt(`${label} bearbeiten:`,old);if(v===null)return;v=v.trim();if(!v)return;if(arr.some((x,i)=>(i!==index)&&String(type==='topicBlocks'?x.name:x).toLocaleLowerCase('de-DE')===v.toLocaleLowerCase('de-DE')))return alert('Dieser Wert ist bereits vorhanden.');if(type==='topicBlocks'){item.name=v;db.trainings.forEach(t=>{if(t.blockId===item.id)t.blockName=v})}else{arr[index]=v;if(type==='trainingTopics'){db.trainings.forEach(t=>{if(t.topic===old)t.topic=v})}else if(type==='seasons'){db.trainings.forEach(t=>{if(t.season===old)t.season=v});db.teams.forEach(t=>{if(t.season===old)t.season=v})}else if(type==='exerciseCategories'){db.exercises.forEach(e=>{if(String(e.category||'')===old)e.category=v})}}save();showSuccessToast(`${label} wurde erfolgreich geändert.`);setup()}

function addSetupItem(type,inputId){let el=document.getElementById(inputId),v=el.value.trim();if(!v)return;let arr=db.settings[type];if(type==="topicBlocks"){if(arr.some(x=>x.name.toLocaleLowerCase("de-DE")===v.toLocaleLowerCase("de-DE")))return alert("Dieser Themenblock ist bereits vorhanden.");arr.push({id:crypto.randomUUID(),name:v})}else{if(arr.some(x=>String(x).toLocaleLowerCase("de-DE")===v.toLocaleLowerCase("de-DE")))return alert("Dieser Wert ist bereits vorhanden.");arr.push(v)}save();showSuccessToast("Eintrag wurde erfolgreich hinzugefügt.");setup()}
function removeSetupItem(type,index){let arr=db.settings[type];if(!arr[index])return;if(!confirm(`Eintrag „${type==="topicBlocks"?arr[index].name:arr[index]}“ wirklich löschen?`))return;let removed=arr[index];arr.splice(index,1);if(type==="topicBlocks"){db.trainings.forEach(t=>{if(t.blockId===removed.id){t.blockId="";t.blockName=""}})}else if(type==="exerciseCategories"){db.exercises.forEach(e=>{if(String(e.category||"")===String(removed))e.category=""})}save();showSuccessToast("Eintrag wurde erfolgreich gelöscht.");setup()}

let exerciseFilter={text:"",category:""};
function renumberExerciseLibrary(){
  (db.exercises||[]).forEach((e,i)=>{e.code=`Ü-${String(i+1).padStart(3,"0")}`});
}
function nextExerciseCode(){
 let max=0;
 (db.exercises||[]).forEach(e=>{
  const m=String(e.code||"").trim().match(/^Ü-(\d+)$/i);
  if(m)max=Math.max(max,Number(m[1])||0);
 });
 return `Ü-${String(max+1).padStart(3,"0")}`;
}

function closeExerciseViewer(){document.getElementById("exerciseViewerBackdrop")?.remove();}
function viewExercise(id){
  const ex=db.exercises.find(e=>e.id===id);if(!ex)return;
  openExerciseViewer(ex,{});
}
function viewTrainingExercise(id){
  const ex=(window.trainingExercisesDraft||[]).find(x=>x.id===id);if(!ex)return;
  const source=ex.exerciseId?db.exercises.find(e=>e.id===ex.exerciseId):null;
  const merged=source?{...source,name:ex.name||source.name,duration:ex.duration||source.duration,notes:ex.notes||source.notes}:ex;
  openExerciseViewer(merged,{training:true,linkedName:source?.name||""});
}
function openExerciseViewer(ex,meta={}){
  closeExerciseViewer();
  const images=Array.isArray(ex.images)?ex.images:[];
  const iw=Math.max(180,Math.min(900,Number(ex.imageWidth)||420));
  const ih=Math.max(120,Math.min(650,Number(ex.imageHeight)||280));
  const board=ex.board&&ex.board.enabled?ex.board:null;
  const backdrop=document.createElement("div");backdrop.id="exerciseViewerBackdrop";backdrop.className="exercise-viewer-backdrop";
  backdrop.addEventListener("click",e=>{if(e.target===backdrop)closeExerciseViewer()});
  backdrop.innerHTML=`<div class="exercise-viewer" role="dialog" aria-modal="true" aria-label="Übung ansehen">
    <div class="exercise-viewer-head"><div><div class="exercise-viewer-code">${esc(ex.code||"")}</div><div class="exercise-viewer-title">${esc(ex.name||"Ohne Bezeichnung")}</div><div class="exercise-viewer-meta"><span>${esc(ex.duration||"–")} Min.</span>${ex.category?`<span>${esc(ex.category)}</span>`:""}${meta.training?`<span>Training</span>`:""}</div></div><button type="button" class="exercise-viewer-close" onclick="closeExerciseViewer()">✕</button></div>
    ${ex.notes?`<div class="exercise-viewer-section"><h3>Beschreibung / Ablauf</h3><div style="white-space:pre-wrap;line-height:1.55">${esc(ex.notes)}</div></div>`:""}
    ${images.length?`<div class="exercise-viewer-section"><h3>Grafik${images.length>1?"en":""}</h3><div class="exercise-viewer-images">${images.map(im=>`<div class="exercise-viewer-image-frame" style="width:${iw}px;height:${ih}px"><img src="${im.data}" alt="${esc(im.name||"Übungsbild")}"></div>`).join("")}</div></div>`:""}
    ${board?`<div class="exercise-viewer-section"><h3>Taktikboard</h3><div class="exercise-viewer-board"><svg id="exerciseViewerBoard" class="tactic-board" viewBox="0 0 1140 1026" aria-label="Taktikboard der Übung"></svg></div></div>`:""}
    <div class="exercise-viewer-actions"><button type="button" class="primary" onclick="closeExerciseViewer()">Schließen</button></div>
  </div>`;
  document.body.appendChild(backdrop);
  if(board){
    window.currentExerciseBoard=JSON.parse(JSON.stringify(board));
    window.boardSelectedId=null;window.boardTool="select";
    const svg=document.getElementById("exerciseViewerBoard");
    if(svg){renderBoard();svg.style.pointerEvents="none";}
  }
}

function exerciseForm(ex){
 let e=ex||{id:crypto.randomUUID(),name:"",category:"",code:nextExerciseCode(),notes:"",images:[],imageWidth:420,imageHeight:280,board:{enabled:false,mode:"half",objects:[]}};

 const boardEnabled=e.board?.enabled===true || !!(e.board?.objects?.length);
 document.getElementById("app").innerHTML=`<div class="card"><h2>${ex?"Übung bearbeiten":"Übung anlegen"}</h2><div class="formgrid"><div><label>Übungsname</label><input id="exName" value="${esc(e.name)}" placeholder="z. B. Prellen und Torabschluss"></div><div><label>Kategorie</label><select id="exCategory"><option value="">Keine Kategorie</option>${(db.settings.exerciseCategories||[]).map(c=>`<option value="${esc(c)}" ${String(e.category||"")===String(c)?"selected":""}>${esc(c)}</option>`).join("")}</select><div class="muted" style="font-size:12px;margin-top:4px">Kategorien werden im Setup verwaltet.</div></div><div><label>Übungscode</label><input id="exCode" value="${esc(e.code||"")}" readonly><div class="muted" style="font-size:12px;margin-top:4px">Wird automatisch vergeben und bleibt bei der Übung dauerhaft erhalten.</div></div><div><label>Standarddauer (Min.)</label><input id="exDuration" type="number" min="1" step="1" value="${esc(e.duration||"")}" placeholder="10"></div></div><div style="margin-top:12px"><label>Beschreibung / Ablauf</label><textarea id="exNotes" rows="5" placeholder="Organisation, Ablauf, Coachingpunkte ...">${esc(e.notes||"")}</textarea></div><h3 style="margin-top:22px">Grafik / Bilder (optional)</h3><div class="muted">JPG- oder PNG-Bilder hinzufügen. Die Originaldatei bleibt erhalten; die Darstellung wird auf ein von dir festgelegtes Fenster begrenzt.</div><div class="actions"><input id="exImages" type="file" accept="image/jpeg,image/png" multiple onchange="addExerciseImages(this.files)"></div><div class="exercise-display-controls"><div><label>Fensterbreite (px)</label><input id="exImageWidth" type="number" min="180" max="900" step="10" value="${window.exerciseImageDisplay.width}" onchange="setExerciseImageSize()"></div><div><label>Fensterhöhe (px)</label><input id="exImageHeight" type="number" min="120" max="650" step="10" value="${window.exerciseImageDisplay.height}" onchange="setExerciseImageSize()"></div></div><div id="exerciseImagePreview" class="image-grid"></div><h3 style="margin-top:22px">Taktikboard (optional)</h3><label class="exercise-board-toggle"><input id="exBoardEnabled" type="checkbox" ${boardEnabled?"checked":""} onchange="toggleExerciseBoard()"><span>Taktikboard für diese Übung verwenden</span></label><div id="exerciseBoardEditor" style="display:${boardEnabled?"block":"none"}"><div class="board-toolbar"><div class="tool-group"><span class="tool-label">Spieler / Material</span><button type="button" onclick="boardAdd('attacker')">▲ Angreifer</button><button type="button" onclick="boardAdd('defender')">● Abwehr</button><button type="button" onclick="boardAdd('ball')">● Ball</button><button type="button" onclick="boardAdd('cone')">▲ Hütchen</button><button type="button" onclick="boardAdd('turnbox')">▣ Turnkasten</button><button type="button" onclick="boardAdd('mat')">▬ Matte</button></div><div class="tool-group"><span class="tool-label">Wege / Linien</span><button type="button" onclick="setBoardTool('run')">➜ Laufweg</button><button type="button" onclick="setBoardTool('pass')">⇢ Pass</button><button type="button" onclick="setBoardTool('shot')">〰 Wurf</button><button type="button" onclick="setBoardTool('line')">━ Rote Linie</button></div><div class="tool-group"><button type="button" onclick="setBoardTool('select')" id="selectTool">↖ Auswahl</button><button type="button" onclick="deleteSelectedBoardObject()">🗑 Ausgewähltes löschen</button><button type="button" onclick="undoBoard()">↶ Rückgängig</button><button type="button" onclick="redoBoard()">↷ Wiederholen</button><button type="button" onclick="clearBoard()">Board leeren</button></div></div><div class="board-wrap"><svg id="tacticBoard" class="tactic-board" viewBox="0 0 1140 1026" aria-label="Digitales Handball-Taktikboard"></svg></div><div class="board-help">▲ Angreifer · ● Abwehr · ● Ball · ▲ Hütchen · ▣ Turnkasten · ▬ grüne Matte · ➜ Laufweg · ⇢ gestrichelter Pass · 〰 Wurf · ━ rote Linie. Werkzeug wählen und anschließend auf dem Feld ziehen. Objekte können mit Maus oder Finger verschoben werden.</div></div><div class="actions"><button class="primary" onclick="saveExercise('${ex?ex.id:""}')">Übung speichern</button><button onclick="navigateTo('exercises')">Abbrechen</button></div></div>`;
 window.currentExerciseBoard=JSON.parse(JSON.stringify(e.board||{enabled:boardEnabled,mode:"half",objects:[]}));window.currentExerciseBoard.enabled=boardEnabled;window.currentExerciseBoard.mode="half";window.boardTool="select";window.boardSelectedId=null;window.boardUndo=[];window.boardRedo=[];renderExerciseImages();if(boardEnabled)renderBoard();
}
function setExerciseImageSize(){
 const w=Math.max(180,Math.min(900,Number(document.getElementById("exImageWidth")?.value)||420));
 const h=Math.max(120,Math.min(650,Number(document.getElementById("exImageHeight")?.value)||280));
 window.exerciseImageDisplay={width:w,height:h};renderExerciseImages();
}
function toggleExerciseBoard(){
 const enabled=!!document.getElementById("exBoardEnabled")?.checked;
 window.currentExerciseBoard=window.currentExerciseBoard||{mode:"half",objects:[]};window.currentExerciseBoard.enabled=enabled;
 const el=document.getElementById("exerciseBoardEditor");if(el)el.style.display=enabled?"block":"none";
 if(enabled){if(!document.getElementById("tacticBoard")){/* editor was just shown only if already rendered */}renderBoard();}
}
function addExerciseImages(files){[...files].forEach(file=>{if(!/^image\/(jpeg|png)$/.test(file.type))return;let r=new FileReader();r.onload=()=>{window.exerciseImages=window.exerciseImages||[];window.exerciseImages.push({id:crypto.randomUUID(),name:file.name,data:r.result});renderExerciseImages()};r.readAsDataURL(file)});}
function renderExerciseImages(){let el=document.getElementById("exerciseImagePreview");if(!el)return;const d=window.exerciseImageDisplay||{width:420,height:280};el.innerHTML=(window.exerciseImages||[]).map((im,i)=>`<div class="image-item"><div class="exercise-image-frame" style="width:${d.width}px;height:${d.height}px"><img class="exercise-image" src="${im.data}" alt="${esc(im.name||"Übungsbild")}"></div><button type="button" onclick="removeExerciseImage(${i})">Löschen</button></div>`).join("");}
function removeExerciseImage(i){window.exerciseImages.splice(i,1);renderExerciseImages()}
function boardSvgEl(tag,attrs){let x=document.createElementNS("http://www.w3.org/2000/svg",tag);Object.entries(attrs||{}).forEach(([k,v])=>x.setAttribute(k,v));return x}
function boardInitBackground(svg){
 svg.innerHTML="";
 // Das Spielfeld basiert direkt auf der vom Nutzer bereitgestellten Grafik Handballfeld.jpg.
 // Dadurch bleiben Linienführung, Torraum, 9-m-Linie, Mittellinie und Markierungen exakt erhalten. Das Board zeigt die obere Spielfeldhälfte: Tor oben, Mittellinie unten.
 const W=1140,H=1026;
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 svg.appendChild(boardSvgEl('image',{
   x:0,y:0,width:W,height:H,
   href:'Handballfeld.jpg',
   preserveAspectRatio:'none',
   'pointer-events':'none'
 }));
}

function renderBoard(){
 let svg=document.getElementById("tacticBoard");if(!svg)return;
 boardInitBackground(svg);
 let defs=boardSvgEl("defs");
 let marker=boardSvgEl("marker",{id:"arrowhead",markerWidth:10,markerHeight:10,refX:8,refY:3,orient:"auto",markerUnits:"strokeWidth"});
 marker.appendChild(boardSvgEl("path",{d:"M0,0 L0,6 L9,3 z",fill:"#111"}));defs.appendChild(marker);
 let markerBlue=boardSvgEl("marker",{id:"arrowheadBlue",markerWidth:10,markerHeight:10,refX:8,refY:3,orient:"auto",markerUnits:"strokeWidth"});
 markerBlue.appendChild(boardSvgEl("path",{d:"M0,0 L0,6 L9,3 z",fill:"rgba(0,110,255,.8)"}));defs.appendChild(markerBlue);
 svg.insertBefore(defs,svg.firstChild);
 (window.currentExerciseBoard.objects||[]).forEach(o=>{
   let selected=window.boardSelectedId===o.id;
   let g=boardSvgEl("g",{class:"board-obj"+(selected?" selected":""),transform:o.type.match(/^(run|pass|shot|line)$/)?"":"translate("+o.x+" "+o.y+")"});
   if(o.type==="attacker"){
     g.appendChild(boardSvgEl("polygon",{points:"0,-16 17,14 -17,14",fill:"#d94747",stroke:"#fff","stroke-width":2}));
     if(selected)g.appendChild(boardSvgEl("polygon",{points:"0,-25 26,22 -26,22",fill:"rgba(0,120,255,.28)",stroke:"rgba(0,110,255,.8)","stroke-width":3}));
   }else if(o.type==="defender"){
     g.appendChild(boardSvgEl("circle",{r:15,fill:"#3e70b7",stroke:"#fff","stroke-width":2}));
     if(selected)g.appendChild(boardSvgEl("circle",{r:24,fill:"rgba(0,120,255,.28)",stroke:"rgba(0,110,255,.8)","stroke-width":3}));
   }else if(o.type==="ball"){
     g.appendChild(boardSvgEl("circle",{r:8,fill:"#333",stroke:"#fff","stroke-width":2}));
     if(selected)g.appendChild(boardSvgEl("circle",{r:16,fill:"rgba(0,120,255,.28)",stroke:"rgba(0,110,255,.8)","stroke-width":3}));
   }else if(o.type==="cone"){
     g.appendChild(boardSvgEl("polygon",{points:"0,-15 13,14 -13,14",fill:"#fff",stroke:"#d97900","stroke-width":3}));g.appendChild(boardSvgEl("rect",{x:-13,y:6,width:26,height:7,fill:"#f0a33b",rx:2}));
     if(selected)g.appendChild(boardSvgEl("polygon",{points:"0,-20 19,19 -19,19",fill:"rgba(0,120,255,.28)",stroke:"rgba(0,110,255,.8)","stroke-width":3}));
   }else if(o.type==="turnbox"){g.appendChild(boardSvgEl("rect",{x:-32,y:-20,width:64,height:40,rx:4,fill:"#b88a58",stroke:"#6f4b2a","stroke-width":3}));for(let x=-20;x<=20;x+=10)g.appendChild(boardSvgEl("line",{x1:x,y1:-17,x2:x,y2:17,stroke:"#e5c79d","stroke-width":3}));if(selected)g.appendChild(boardSvgEl("rect",{x:-40,y:-28,width:80,height:56,rx:7,fill:"rgba(0,120,255,.28)",stroke:"rgba(0,110,255,.8)","stroke-width":3}));
   }else if(o.type==="mat"){g.appendChild(boardSvgEl("rect",{x:-38,y:-18,width:76,height:36,rx:5,fill:"#2f9e44",stroke:"#1f6f2f","stroke-width":3}));g.appendChild(boardSvgEl("line",{x1:-28,y1:-10,x2:28,y2:-10,stroke:"#8ed99b","stroke-width":2}));g.appendChild(boardSvgEl("line",{x1:-28,y1:0,x2:28,y2:0,stroke:"#8ed99b","stroke-width":2}));g.appendChild(boardSvgEl("line",{x1:-28,y1:10,x2:28,y2:10,stroke:"#8ed99b","stroke-width":2}));if(selected)g.appendChild(boardSvgEl("rect",{x:-46,y:-26,width:92,height:52,rx:7,fill:"rgba(0,120,255,.28)",stroke:"rgba(0,110,255,.8)","stroke-width":3}));
   }else if(["run","pass","shot","line"].includes(o.type)){
     let attrs={x1:o.x1,y1:o.y1,x2:o.x2,y2:o.y2,fill:"none",stroke:o.type==="line"?"#d71920":"#111","stroke-width":o.type==="line"?6:5,"stroke-linecap":"round","stroke-linejoin":"round",...(o.type==="line"?{}:{"marker-end":"url(#arrowhead)"})};
     if(o.type==="pass")attrs["stroke-dasharray"]="12 9";
     if(o.type==="shot"){
       let dx=o.x2-o.x1,dy=o.y2-o.y1,len=Math.max(1,Math.hypot(dx,dy)),nx=-dy/len*10,ny=dx/len*10, mx=(o.x1+o.x2)/2,my=(o.y1+o.y2)/2;
       attrs.d=`M ${o.x1} ${o.y1} Q ${mx+nx} ${my+ny} ${o.x2} ${o.y2}`;delete attrs.x1;delete attrs.y1;delete attrs.x2;delete attrs.y2;delete attrs["marker-end"];
       g.appendChild(boardSvgEl("path",attrs));
       g.appendChild(boardSvgEl("path",{d:`M ${o.x2-10} ${o.y2-5} L ${o.x2} ${o.y2} L ${o.x2-5} ${o.y2+10}`,fill:"none",stroke:"#111","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"}));
       if(selected){g.appendChild(boardSvgEl("path",{d:`M ${o.x1} ${o.y1} Q ${mx+nx} ${my+ny} ${o.x2} ${o.y2}`,fill:"none",stroke:"rgba(0,110,255,.75)","stroke-width":14,"stroke-linecap":"round",opacity:.38}));}
     }else{
       g.appendChild(boardSvgEl("line",attrs));
       if(selected)g.appendChild(boardSvgEl("line",{x1:o.x1,y1:o.y1,x2:o.x2,y2:o.y2,stroke:"rgba(0,110,255,.75)","stroke-width":14,"stroke-linecap":"round",opacity:.38,...(o.type==="line"?{}:{"marker-end":"url(#arrowheadBlue)"}),"stroke-dasharray":o.type==="pass"?"12 9":"none"}));
     }
   }
   g.addEventListener("pointerdown",ev=>boardPointerDown(ev,o));svg.appendChild(g);
 });
 svg.onpointerdown=boardBackgroundPointerDown;
}
function boardPoint(ev){let svg=document.getElementById("tacticBoard"),r=svg.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*1140,y:(ev.clientY-r.top)/r.height*1026}}
function boardSnapshot(){return JSON.stringify(window.currentExerciseBoard.objects||[])}
function pushUndo(){window.boardUndo=window.boardUndo||[];window.boardRedo=window.boardRedo||[];window.boardUndo.push(boardSnapshot());if(window.boardUndo.length>50)window.boardUndo.shift();window.boardRedo=[]}
function restoreObjects(json){window.currentExerciseBoard.objects=JSON.parse(json||"[]");window.boardSelectedId=null;renderBoard()}
function undoBoard(){if(!window.boardUndo?.length)return;window.boardRedo=window.boardRedo||[];window.boardRedo.push(boardSnapshot());restoreObjects(window.boardUndo.pop())}
function redoBoard(){if(!window.boardRedo?.length)return;window.boardUndo=window.boardUndo||[];window.boardUndo.push(boardSnapshot());restoreObjects(window.boardRedo.pop())}
function boardAdd(type){pushUndo();let p={x:570,y:520};if(type==="attacker")p={x:570,y:700};if(type==="defender")p={x:680,y:600};if(type==="ball")p={x:620,y:520};if(type==="cone")p={x:450,y:600};if(type==="turnbox")p={x:450,y:500};if(type==="mat")p={x:450,y:570};let obj={id:crypto.randomUUID(),type,...p};window.currentExerciseBoard.objects.push(obj);window.boardSelectedId=obj.id;window.boardTool="select";renderBoard()}
function setBoardTool(tool){window.boardTool=tool;document.querySelectorAll('.board-toolbar button').forEach(b=>b.classList.remove('active'));let labels={run:'Laufweg',pass:'Pass',shot:'Wurf',line:'Rote Linie',select:'Auswahl'};document.querySelectorAll('.board-toolbar button').forEach(b=>{if(b.textContent.includes(labels[tool]||'___'))b.classList.add('active')});}
function deleteSelectedBoardObject(){if(!window.boardSelectedId)return;pushUndo();window.currentExerciseBoard.objects=(window.currentExerciseBoard.objects||[]).filter(o=>o.id!==window.boardSelectedId);window.boardSelectedId=null;renderBoard()}
function boardSelectObject(o){window.boardSelectedId=o.id;window.boardTool="select";renderBoard()}
function boardPointerDown(ev,o){ev.stopPropagation();boardSelectObject(o);let svg=document.getElementById("tacticBoard");svg.setPointerCapture?.(ev.pointerId);if(window.boardTool!=="select")return;pushUndo();let start=boardPoint(ev),orig={x:o.x,y:o.y,x1:o.x1,y1:o.y1,x2:o.x2,y2:o.y2};function move(e){let p=boardPoint(e),dx=p.x-start.x,dy=p.y-start.y;if(["run","pass","shot","line"].includes(o.type)){o.x1=orig.x1+dx;o.y1=orig.y1+dy;o.x2=orig.x2+dx;o.y2=orig.y2+dy}else{o.x=orig.x+dx;o.y=orig.y+dy}renderBoard()}function up(){svg.removeEventListener("pointermove",move);svg.removeEventListener("pointerup",up)}svg.addEventListener("pointermove",move);svg.addEventListener("pointerup",up)}
function boardBackgroundPointerDown(ev){if(window.boardTool==="select"){window.boardSelectedId=null;renderBoard();return}if(!["run","pass","shot","line"].includes(window.boardTool))return;let start=boardPoint(ev);let svg=document.getElementById("tacticBoard");function move(e){window.boardTemp=boardPoint(e);renderBoard();drawTempArrow(start,window.boardTemp,window.boardTool)}function up(e){let end=boardPoint(e);if(Math.hypot(end.x-start.x,end.y-start.y)>15){pushUndo();let obj={id:crypto.randomUUID(),type:window.boardTool,x1:start.x,y1:start.y,x2:end.x,y2:end.y};window.currentExerciseBoard.objects.push(obj);window.boardSelectedId=obj.id;}window.boardTemp=null;svg.removeEventListener("pointermove",move);svg.removeEventListener("pointerup",up);window.boardTool="select";renderBoard()}svg.addEventListener("pointermove",move);svg.addEventListener("pointerup",up)}
function drawTempArrow(a,b,type){let svg=document.getElementById("tacticBoard");if(!svg||!b)return;let attrs={x1:a.x,y1:a.y,x2:b.x,y2:b.y,fill:"none",stroke:type==="line"?"#d71920":"#111","stroke-width":type==="line"?6:5,"stroke-linecap":"round",...(type==="line"?{}:{"marker-end":"url(#arrowhead)"})};if(type==="pass")attrs["stroke-dasharray"]="12 9";if(type==="shot"){let dx=b.x-a.x,dy=b.y-a.y,len=Math.max(1,Math.hypot(dx,dy)),nx=-dy/len*10,ny=dx/len*10,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;delete attrs.x1;delete attrs.y1;delete attrs.x2;delete attrs.y2;delete attrs["marker-end"];attrs.d=`M ${a.x} ${a.y} Q ${mx+nx} ${my+ny} ${b.x} ${b.y}`;svg.appendChild(boardSvgEl("path",attrs));return}svg.appendChild(boardSvgEl("line",attrs))}
function clearBoard(){if(confirm("Board wirklich leeren?")){pushUndo();window.currentExerciseBoard.objects=[];window.boardSelectedId=null;renderBoard()}}
function saveExercise(id){let name=document.getElementById("exName").value.trim();if(!name)return alert("Bitte einen Übungsnamen eingeben.");let obj={id:id||crypto.randomUUID(),name,category:document.getElementById("exCategory").value.trim(),code:document.getElementById("exCode").value.trim(),duration:document.getElementById("exDuration").value.trim(),notes:document.getElementById("exNotes").value.trim(),images:window.exerciseImages||[],imageWidth:Number(window.exerciseImageDisplay?.width)||420,imageHeight:Number(window.exerciseImageDisplay?.height)||280,board:{...(window.currentExerciseBoard||{mode:"half",objects:[]}),enabled:!!document.getElementById("exBoardEnabled")?.checked}};if(!obj.board.enabled)obj.board.objects=[];if(id)db.exercises=db.exercises.map(e=>e.id===id?obj:e);else db.exercises.unshift(obj);save();showSuccessToast("Übung wurde erfolgreich gespeichert.");exerciseForm(obj)}

document.addEventListener("keydown",ev=>{if((ev.key==="Delete"||ev.key==="Backspace")&&window.currentExerciseBoard&&window.boardSelectedId&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)){ev.preventDefault();deleteSelectedBoardObject();}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)){ev.preventDefault();undoBoard();}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="y"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)){ev.preventDefault();redoBoard();}});

function exportData(){
 if(!db.meta||typeof db.meta!=="object")db.meta={};
 db.meta.databaseId=db.meta.databaseId||crypto.randomUUID();
 db.meta.databaseVersion=DB_FORMAT_VERSION;
 db.meta.appVersion=APP_VERSION;
 db.meta.exportedAt=new Date().toISOString();
 db.meta.updatedAt=db.meta.updatedAt||new Date().toISOString();
 const payload={
  format:"TSV-Nettelkamp-Handball-Database",
  formatVersion:DB_FORMAT_VERSION,
  exportedAt:db.meta.exportedAt,
  appVersion:APP_VERSION,
  databaseId:db.meta.databaseId,
  database:db
 };
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=`tsv_nettelkamp_handball_backup_${new Date().toISOString().slice(0,10)}.json`;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 save();
 showSuccessToast("Datenbank wurde exportiert.");
}
function normalizeDatabase(){
 if(!db||typeof db!=="object")throw new Error("Ungültige Datenbank");
 if(!Array.isArray(db.players))db.players=[];if(!Array.isArray(db.trainings))db.trainings=[];if(!Array.isArray(db.observations))db.observations=[];if(!db.assessments||typeof db.assessments!=="object")db.assessments={};if(!Array.isArray(db.exercises))db.exercises=[];
 if(!Array.isArray(db.teams)||!db.teams.length)db.teams=[{id:"team-f",name:"F-Jugend",season:"2026/27"}];
 if(!db.activeTeamId||!db.teams.some(t=>t.id===db.activeTeamId))db.activeTeamId=db.teams[0].id;
 if(!db.settings||typeof db.settings!=="object")db.settings={};
 if(!Array.isArray(db.settings.trainingTopics))db.settings.trainingTopics=[];if(!Array.isArray(db.settings.topicBlocks))db.settings.topicBlocks=[];if(!Array.isArray(db.settings.seasons))db.settings.seasons=[];if(!Array.isArray(db.settings.exerciseCategories))db.settings.exerciseCategories=[];
 if(typeof db.settings.clubName!=="string"||!db.settings.clubName)db.settings.clubName="TSV Nettelkamp";if(typeof db.settings.logo!=="string")db.settings.logo="";if(typeof db.settings.coachName!=="string")db.settings.coachName="";if(typeof db.settings.coachBirthDate!=="string")db.settings.coachBirthDate="";if(typeof db.settings.themeColor!=="string"||!/^#[0-9a-fA-F]{6}$/.test(db.settings.themeColor))db.settings.themeColor="#176b45";if(db.settings.appearance!=="dark"&&db.settings.appearance!=="light")db.settings.appearance="light";
 if(!db.meta||typeof db.meta!=="object")db.meta={};
 if(!db.meta.databaseId)db.meta.databaseId=crypto.randomUUID();
 db.meta.databaseVersion=DB_FORMAT_VERSION;db.meta.appVersion=APP_VERSION;
 if(!db.meta.updatedAt)db.meta.updatedAt=new Date().toISOString();
 db.teams.forEach(t=>{if(!t.season)t.season=db.settings.seasons[0]||"2026/27";if(!db.settings.seasons.includes(t.season))db.settings.seasons.push(t.season)});
 let oldSeasons=db.planning?.seasons||[];oldSeasons.forEach(x=>{let n=String(x.name||"").trim();if(n&&!db.settings.seasons.includes(n))db.settings.seasons.push(n)});
 let oldBlocks=db.planning?.blocks||[];oldBlocks.forEach(x=>{let n=String(x.name||"").trim();if(n&&!db.settings.topicBlocks.some(b=>b.name===n))db.settings.topicBlocks.push({id:x.id||crypto.randomUUID(),name:n})});
 db.trainings.forEach(t=>{if(!t.teamId)t.teamId=db.teams[0].id;if(!t.season)t.season=db.teams.find(x=>x.id===t.teamId)?.season||db.settings.seasons[0]||"";if(!Array.isArray(t.exercises))t.exercises=[];let n=String(t.topic||"").trim();if(n&&!db.settings.trainingTopics.includes(n))db.settings.trainingTopics.push(n)});
 db.players.forEach(p=>{if(!p.teamId)p.teamId=db.teams[0].id;if(!p.gender)p.gender="männlich"});

function cloneForImport(value,maxDepth=40){
 // Iterativer Klon: verhindert Safari-Stackoverflow bei ungewöhnlich tiefen Backup-Strukturen.
 if(value===null||typeof value!=="object")return value;
 const root=Array.isArray(value)?[]:{};
 const seen=new WeakMap([[value,root]]);
 const stack=[{src:value,dst:root,depth:0}];
 while(stack.length){
  const {src,dst,depth}=stack.pop();
  if(depth>=maxDepth)continue;
  for(const key of Object.keys(src)){
   const v=src[key];
   if(v===null||typeof v!=="object")dst[key]=v;
   else if(seen.has(v))dst[key]=seen.get(v);
   else{
    const child=Array.isArray(v)?[]:{};
    seen.set(v,child);dst[key]=child;
    stack.push({src:v,dst:child,depth:depth+1});
   }
  }
 }

}

function scheduleCloudSync(){if(!cloudSyncInitialized)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(pushDbToCloud,500)}
async function promoteUnlinkedTrainingExercisesToLibrary(){
  let changed=false;
  const byCode=new Map(db.exercises.filter(e=>e.code).map(e=>[String(e.code).trim().toLowerCase(),e]));
  const byName=new Map(db.exercises.filter(e=>e.name).map(e=>[String(e.name).trim().toLowerCase(),e]));
  for(const t of db.trainings||[]){
    for(const ex of t.exercises||[]){
      if(ex.exerciseId)continue;
      const code=String(ex.code||"").trim().toLowerCase();
      const name=String(ex.name||"").trim().toLowerCase();
      let lib=(code&&byCode.get(code))||(name&&byName.get(name));
      if(!lib){
        lib={id:crypto.randomUUID(),code:ex.code||"",name:ex.name||"Ohne Bezeichnung",category:"",notes:ex.notes||"",duration:ex.duration==null?"":String(ex.duration),images:[],imageWidth:420,imageHeight:280,board:{enabled:false,mode:"half",objects:[]}};
        db.exercises.unshift(lib);
        if(code)byCode.set(code,lib);
        if(name)byName.set(name,lib);
      }
      ex.exerciseId=lib.id;
      changed=true;
    }
  }
  if(changed){
    localStorage.setItem(KEY,JSON.stringify(db));
    persistUserLocalDatabase();
    updateSaveState(true);
    scheduleCloudSync();
  }
  return changed;
}
async function initializeCloudData(){
 if(!currentAuthUserId)return;
 cloudSyncInitialized=true;

 try{

  if(!(r.data||[]).length){
    // No cloud data for this authenticated user. Only the first authenticated
    // owner may migrate the legacy browser database. Every other user must
    // start with an empty local database; never expose another user's cache.
    if(allowLegacyMigration && (db.teams||[]).length){
      await pushDbToCloud();
      allowLegacyMigration=false;
    } else {
      clearLocalDatabaseState();
      persistUserLocalDatabase();
      updateTeamHeader();

    }

  }

  if(settingsResult.error)throw settingsResult.error;

    };
    const planMeta=Array.isArray(s.topic_blocks)?s.topic_blocks.find(x=>x&&x.id==="__seasonplan_meta__"):null;
    db.planning=db.planning||{seasons:[],blocks:[],cycles:[],seasonPlans:[]};
    db.planning.seasonPlans=Array.isArray(planMeta?.meta?.seasonPlans)?planMeta.meta.seasonPlans:[]
  }
  const ids=teams.map(t=>t.season_id).filter(Boolean);
  const sr=ids.length?await supabaseClient.from("seasons").select("id,name").in("id",ids):{data:[]};if(sr.error)throw sr.error;
  const sm=Object.fromEntries((sr.data||[]).map(x=>[x.id,x.name]));
  const pr=await supabaseClient.from("players").select("*");if(pr.error)throw pr.error;
  const tr=await supabaseClient.from("trainings").select("*");if(tr.error)throw tr.error;
  const ar=await supabaseClient.from("training_attendance").select("training_id,player_id,present");if(ar.error)throw ar.error;
  const er=await supabaseClient.from("exercises").select("*");if(er.error)throw er.error;
  const ter=await supabaseClient.from("training_exercises").select("id,training_id,exercise_id,code,name,duration,notes");if(ter.error)throw ter.error;
  const asr=await supabaseClient.from("player_assessments").select("player_id,period,skill,rating");if(asr.error)throw asr.error;
  const obr=await supabaseClient.from("player_observations").select("id,player_id,observation_date,text");if(obr.error)throw obr.error;
  db.teams=teams.map(t=>({id:t.id,name:t.name,season:sm[t.season_id]||""}));
  db.players=(pr.data||[]).map(p=>({id:p.id,name:p.name,birthDate:p.birth_date||"",birth:derivedBirthYear({birthDate:p.birth_date}),gender:p.gender||"",hand:p.hand||"",position:p.position||"",entryDate:p.entry_date||"",teamId:p.team_id}));
  const exerciseRows=(er.data||[]).slice().sort((a,b)=>String(a.created_at||"").localeCompare(String(b.created_at||"")));
  db.exercises=exerciseRows.map(e=>({id:e.id,code:e.code||"",name:e.name||"",notes:e.notes||"",duration:e.duration==null?"":String(e.duration),category:e.category||"",images:Array.isArray(e.images)?e.images:[],imageWidth:Number(e.image_width)||420,imageHeight:Number(e.image_height)||280,board:e.board||{enabled:false,mode:"half",objects:[]}}));
  renumberExerciseLibrary();
  const exerciseMap=Object.fromEntries(db.exercises.map(e=>[e.id,e]));
  const teByTraining={};(ter.data||[]).forEach(x=>{(teByTraining[x.training_id]||(teByTraining[x.training_id]=[])).push(x)});
  db.trainings=(tr.data||[]).map(t=>({id:t.id,date:t.date||"",season:sm[t.season_id]||"",topic:t.topic||"",notes:t.notes||"",blockName:t.block_name||"",teamId:t.team_id,present:(ar.data||[]).filter(a=>a.training_id===t.id&&a.present).map(a=>a.player_id),exercises:(teByTraining[t.id]||[]).map(x=>{const base=exerciseMap[x.exercise_id]||{};return {id:x.id||crypto.randomUUID(),instanceId:x.id||crypto.randomUUID(),exerciseId:x.exercise_id||"",code:x.code||base.code||"",name:x.name||base.name||"",notes:x.notes||base.notes||"",duration:x.duration==null?(base.duration||""):String(x.duration)}})}));
  await promoteUnlinkedTrainingExercisesToLibrary();
  db.assessments={};
  (asr.data||[]).forEach(x=>{
    if(!db.assessments[x.player_id])db.assessments[x.player_id]={start:{},mid:{},end:{}};
    if(!db.assessments[x.player_id][x.period])db.assessments[x.player_id][x.period]={};
    db.assessments[x.player_id][x.period][x.skill]=Number(x.rating);
  });
  db.observations=(obr.data||[]).map(o=>({id:o.id,player:o.player_id||"",date:o.observation_date||"",text:o.text||"",teamId:(db.players.find(p=>p.id===o.player_id)||{}).teamId||""}));
  db.activeTeamId=db.teams.some(t=>t.id===db.activeTeamId)?db.activeTeamId:(db.teams[0]?.id||"");
  persistUserLocalDatabase();updateTeamHeader();updateSaveState(true);
 }catch(e){await cloudError("Daten laden",e)}
}

async function logout(){
  const {error}=await supabaseClient.auth.signOut();
  if(error){alert("Abmelden fehlgeschlagen: "+error.message);return;}
  document.getElementById("appShell").style.visibility="hidden";
  document.getElementById("loginGate").classList.remove("hidden");
  document.getElementById("loginPassword").value="";
  cloudSyncInitialized=false;
  currentAuthUserId="";
  currentAuthUserEmail="";
  allowLegacyMigration=false;
  updateTeamHeader();
  document.getElementById("loginEmail").focus();
}
async function authWithTimeout(promise, ms=15000){
  let timer;
  try{
    return await Promise.race([
      promise,
      new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error("Zeitüberschreitung bei der Verbindung zu Supabase.")),ms)})
    ]);
  }finally{clearTimeout(timer);}
}
async function initAuthGate(){
  const gate=document.getElementById("loginGate"), shell=document.getElementById("appShell"), form=document.getElementById("loginForm"), email=document.getElementById("loginEmail"), password=document.getElementById("loginPassword"), button=document.getElementById("loginButton"), errorBox=document.getElementById("loginError");
  let openingUserId="";
  let openingPromise=null;
  const openAuthenticatedApp=async(session)=>{
    const uid=session?.user?.id;
    if(!uid)return false;
    currentAuthUserEmail=session?.user?.email||"";
    if(openingPromise && openingUserId===uid)return openingPromise;
    openingUserId=uid;
    openingPromise=(async()=>{
      cloudSyncInitialized=false;
      // SECURITY: the browser cache is never a source of truth after login.
      // Always start with an empty in-memory database and load only rows
      // returned by Supabase under the authenticated user's RLS policies.
      clearLocalDatabaseState();
      currentAuthUserId=uid;
      allowLegacyMigration=false;

      // IMPORTANT for iPad/Safari: show the application immediately after
      // Supabase has returned a valid session. Cloud data loading must never
      // keep the login gate visible or leave the screen blank.
      gate.classList.add("hidden");
      shell.style.visibility="visible";
      nav();
      document.getElementById("app").innerHTML='<div class="card"><h2>Daten werden geladen …</h2><p class="muted">Die Verbindung zur Vereinsdatenbank wird hergestellt.</p></div>';

      try{
        await initializeCloudData();
      }catch(e){
        console.error("Cloud-Initialisierung fehlgeschlagen:",e);
      }
      nav();
      navigateTo("dashboard");
      return true;
    })();
    try{return await openingPromise;}finally{openingPromise=null;}
  };

  try{
    const {data:{session}}=await authWithTimeout(supabaseClient.auth.getSession());
    if(session) await openAuthenticatedApp(session); else email.focus();
  }catch(e){
    console.error("Auth-Initialisierung fehlgeschlagen:",e);
    email.focus();
  }

  supabaseClient.auth.onAuthStateChange((event)=>{
    if(event==="SIGNED_OUT") {
      openingUserId="";
      openingPromise=null;
    }
  });

  form.addEventListener("submit",async e=>{
    e.preventDefault();
    errorBox.textContent="";
    button.disabled=true;
    button.textContent="Anmeldung…";
    try{
      const result=await authWithTimeout(
        supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value}),
        15000
      );
      if(result.error)throw result.error;
      const session=result.data?.session;
      if(!session)throw new Error("Anmeldung war erfolgreich, aber es wurde keine Sitzung zurückgegeben.");

      // Do NOT call getSession() again here. On iPad/Safari this second
      // asynchronous auth lookup can stall. We already have the valid session
      // returned by signInWithPassword().
      button.disabled=false;
      button.textContent="Anmelden";
      await openAuthenticatedApp(session);
    }catch(error){
      console.error("Anmeldung fehlgeschlagen:",error);
      errorBox.textContent=error?.message||"Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.";
      button.disabled=false;
      button.textContent="Anmelden";
      password.focus();
    }
  });
}
